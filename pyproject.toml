[project]
name = "smartdialer"
version = "0.1.0"
description = "CredResolve SmartDialer prototype - Progressive and Predictive dialer with Safety Controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = [
    "ignore::DeprecationWarning:aiosqlite.*",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Pacing must not import providers"
type = "forbidden"
source_modules = ["app.pacing"]
forbidden_modules = ["app.providers"]
